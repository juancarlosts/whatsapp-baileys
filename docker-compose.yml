services:
  whatsapp-notify:
    build: .
    container_name: whatsapp-notify
    user: "1001:1001" # dueño de ./session en el host
    env_file: .env
    environment:
      - SESSION_DIR=/app/session
    volumes:
      - ./session:/app/session
    networks:
      - repanet
    # Sin "ports": solo accesible desde la red Docker repanet
    mem_limit: 192m
    memswap_limit: 256m
    cpus: 0.5
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/status"]
      interval: 60s
      timeout: 5s
      retries: 3

networks:
  repanet:
    external: true
